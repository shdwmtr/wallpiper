name: AUR Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to AUR?"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/arch/**"
      - "**/Makefile"
      - "**/CMakeLists.txt"
      - ".github/workflows/aur.yml"
  pull_request:
    paths:
      - "packages/arch/**"
      - "**/Makefile"
      - "**/CMakeLists.txt"
      - ".github/workflows/aur.yml"

concurrency:
  group: aur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pkgbuild:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - wallpiper-git
          - wallpiper-hyprland-git
          - wallpiper-sway-git
          - wallpiper-cosmic-git
          - wallpiper-i3-git
          - wallpiper-gnome-git
          - wallpiper-kde-git

    steps:
      - name: Setup pacman
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and install wallpiper-git
        if: matrix.pkg != 'wallpiper-git'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -r "packages/arch/wallpiper-git" /home/builder/core

          sed -i "s#git+\$url.git#git+file://$GITHUB_WORKSPACE#" /home/builder/core/PKGBUILD
          chown -R builder:builder /home/builder/core
          su builder -c 'cd /home/builder/core && makepkg -s --noconfirm'
          corepkg=$(ls /home/builder/core/wallpiper-git-*.pkg.tar.zst | grep -v -- '-debug-')
          pacman -U --noconfirm "$corepkg"

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -r "packages/arch/${{ matrix.pkg }}" /home/builder/pkg

          sed -i "s#git+\$url.git#git+file://$GITHUB_WORKSPACE#" /home/builder/pkg/PKGBUILD
          chown -R builder:builder /home/builder/pkg
          su builder -c 'cd /home/builder/pkg && makepkg -s --noconfirm'

      - name: Verify package
        run: |
          echo "=== Built packages ==="
          ls -lh /home/builder/pkg/*.pkg.tar.zst

          mkdir -p /tmp/verify
          pkgfile=$(ls /home/builder/pkg/${{ matrix.pkg }}-*.pkg.tar.zst | grep -v -- '-debug-')
          tar -xf "$pkgfile" -C /tmp/verify

          MISSING=0
          check() {
            if [ -e "/tmp/verify/$1" ] || [ -L "/tmp/verify/$1" ]; then
              echo "  FOUND:   $1"
            else
              echo "  MISSING: $1"
              MISSING=1
            fi
          }

          case "${{ matrix.pkg }}" in
            wallpiper-git)
              check usr/lib/wallpiper/wallpiperd
              check usr/lib/wallpiper/wallpiperctl
              check usr/lib/wallpiper/libwallpiper-preload.so
              check usr/lib/wallpiper/libVkLayer_wallpiper_capture.so
              check usr/lib/wallpiper/dwmapi.dll
              check usr/bin/wallpiperd
              check usr/bin/wallpiperctl
              ;;
            wallpiper-hyprland-git)
              check usr/lib/wallpiper/wallpiper-portal-hyprland
              ;;
            wallpiper-sway-git)
              check usr/lib/wallpiper/wallpiper-portal-sway
              ;;
            wallpiper-cosmic-git)
              check usr/lib/wallpiper/wallpiper-portal-cosmic
              ;;
            wallpiper-i3-git)
              check usr/lib/wallpiper/wallpiper-portal-i3
              ;;
            wallpiper-gnome-git)
              check usr/lib/libwallpiper-1.0.so
              check usr/lib/girepository-1.0/Wallpiper-1.0.typelib
              check "usr/share/gnome-shell/extensions/wallpiper-gnome@wallpiper.dev/metadata.json"
              ;;
            wallpiper-kde-git)
              check usr/lib/qt6/qml/dev/wallpiper/capture/libwallpiper_capture_plugin.so
              check usr/share/plasma/wallpapers/dev.wallpiper.kde/metadata.json
              ;;
          esac

          [ "$MISSING" -eq 0 ] || { echo "ERROR: one or more required files missing from package"; exit 1; }

  publish-core:
    needs: test-pkgbuild
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish wallpiper-git
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: wallpiper-git
          pkgbuild: ./packages/arch/wallpiper-git/PKGBUILD
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519

  publish-portals:
    needs: publish-core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: wallpiper-hyprland-git
            assets: ""
          - pkg: wallpiper-sway-git
            assets: ""
          - pkg: wallpiper-cosmic-git
            assets: ""
          - pkg: wallpiper-i3-git
            assets: ""
          - pkg: wallpiper-gnome-git
            assets: "./packages/arch/wallpiper-gnome-git/wallpiper-gnome-git.install"
          - pkg: wallpiper-kde-git
            assets: "./packages/arch/wallpiper-kde-git/wallpiper-kde-git.install"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ./packages/arch/${{ matrix.pkg }}/PKGBUILD
          assets: ${{ matrix.assets }}
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
