name: AUR Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to AUR?"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/arch/**"
      - "**/Makefile"
      - "**/CMakeLists.txt"
      - ".github/workflows/aur.yml"
  pull_request:
    paths:
      - "packages/arch/**"
      - "**/Makefile"
      - "**/CMakeLists.txt"
      - ".github/workflows/aur.yml"

jobs:
  test-pkgbuild:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    concurrency:
      group: aur-test-${{ matrix.pkg }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - wallpiper
          - wallpiper-hyprland
          - wallpiper-sway
          - wallpiper-cosmic
          - wallpiper-i3
          - wallpiper-gnome
          - wallpiper-kde

    steps:
      - name: Setup pacman
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and install wallpiper
        if: matrix.pkg != 'wallpiper'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -r "packages/arch/wallpiper" /home/builder/core

          sed -i "s#git+\$url.git#git+file://$GITHUB_WORKSPACE#" /home/builder/core/PKGBUILD
          chown -R builder:builder /home/builder/core
          su builder -c 'cd /home/builder/core && makepkg -s --noconfirm'
          corepkg=$(ls /home/builder/core/wallpiper-*.pkg.tar.zst | grep -v -- '-debug-')
          pacman -U --noconfirm "$corepkg"

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -r "packages/arch/${{ matrix.pkg }}" /home/builder/pkg

          sed -i "s#git+\$url.git#git+file://$GITHUB_WORKSPACE#" /home/builder/pkg/PKGBUILD
          chown -R builder:builder /home/builder/pkg
          su builder -c 'cd /home/builder/pkg && makepkg -s --noconfirm'

      - name: Verify package
        run: |
          echo "=== Built packages ==="
          ls -lh /home/builder/pkg/*.pkg.tar.zst

          mkdir -p /tmp/verify
          pkgfile=$(ls /home/builder/pkg/${{ matrix.pkg }}-*.pkg.tar.zst | grep -v -- '-debug-')
          tar -xf "$pkgfile" -C /tmp/verify

          MISSING=0
          check() {
            if [ -e "/tmp/verify/$1" ] || [ -L "/tmp/verify/$1" ]; then
              echo "  FOUND:   $1"
            else
              echo "  MISSING: $1"
              MISSING=1
            fi
          }

          case "${{ matrix.pkg }}" in
            wallpiper)
              check usr/lib/wallpiper/wallpiperd
              check usr/lib/wallpiper/wallpiperctl
              check usr/lib/wallpiper/libwallpiper-preload.so
              check usr/lib/wallpiper/libVkLayer_wallpiper_capture.so
              check usr/lib/wallpiper/dwmapi.dll
              check usr/bin/wallpiperd
              check usr/bin/wallpiperctl
              ;;
            wallpiper-hyprland)
              check usr/lib/wallpiper/wallpiper-portal-hyprland
              ;;
            wallpiper-sway)
              check usr/lib/wallpiper/wallpiper-portal-sway
              ;;
            wallpiper-cosmic)
              check usr/lib/wallpiper/wallpiper-portal-cosmic
              ;;
            wallpiper-i3)
              check usr/lib/wallpiper/wallpiper-portal-i3
              ;;
            wallpiper-gnome)
              check usr/lib/libwallpiper-1.0.so
              check usr/lib/girepository-1.0/Wallpiper-1.0.typelib
              check "usr/share/gnome-shell/extensions/wallpiper-gnome@wallpiper.dev/metadata.json"
              ;;
            wallpiper-kde)
              check usr/lib/qt6/qml/dev/wallpiper/capture/libwallpiper_capture_plugin.so
              check usr/share/plasma/wallpapers/dev.wallpiper.kde/metadata.json
              ;;
          esac

          [ "$MISSING" -eq 0 ] || { echo "ERROR: one or more required files missing from package"; exit 1; }

  publish-core:
    needs: test-pkgbuild
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    concurrency:
      group: aur-publish-core-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish wallpiper
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: wallpiper
          pkgbuild: ./packages/arch/wallpiper/PKGBUILD
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519

  publish-portals:
    needs: publish-core
    runs-on: ubuntu-latest
    concurrency:
      group: aur-publish-portals-${{ matrix.pkg }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - pkg: wallpiper-hyprland
            assets: ""
          - pkg: wallpiper-sway
            assets: ""
          - pkg: wallpiper-cosmic
            assets: ""
          - pkg: wallpiper-i3
            assets: ""
          - pkg: wallpiper-gnome
            assets: "./packages/arch/wallpiper-gnome/wallpiper-gnome.install"
          - pkg: wallpiper-kde
            assets: "./packages/arch/wallpiper-kde/wallpiper-kde.install"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ./packages/arch/${{ matrix.pkg }}/PKGBUILD
          assets: ${{ matrix.assets }}
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
