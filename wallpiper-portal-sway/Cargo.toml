[workspace]

[package]
name = "wallpiper-portal-sway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wallpiper-portal-sway"
path = "src/main.rs"

[dependencies]
wallpiper-protocol = { path = "../crates/wallpiper-protocol" }
serde_json = "1"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
libc = "0.2"
